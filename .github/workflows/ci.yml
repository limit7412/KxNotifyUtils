name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # 型検査と単体テストを先に回して、Windows ランナーを待たずに壊れているとわかるようにする。
  check:
    name: 型検査と単体テスト (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.14.0

      - name: 依存 shard を取得する
        run: shards install

      - name: 書式を確かめる
        run: crystal tool format --check src spec

      - name: 単体テストを実行する
        run: crystal spec

      # 実際に配布するのは Windows 版であり、
      # Windows 向けのコード（FFI 宣言、トレイ、設定ウィンドウ）はここでしか型検査されない。
      - name: Windows 向けの型検査を行う
        run: crystal build --cross-compile --target x86_64-pc-windows-msvc src/main.cr -o kx

  build:
    name: ビルド (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.14.0

      - name: 依存 shard を取得する
        run: shards install

      - name: NotifListenerShim をビルドする
        run: |
          cmake -S shim -B shim/build -A x64
          cmake --build shim/build --config Release

      - name: シムのテストハーネスを動かす
        # 通知アクセスが許可されない環境でも、初期化と JSON の組み立てが壊れていないことは確かめられる。
        run: ./shim/build/Release/shim_harness.exe
        continue-on-error: true

      - name: 単体テストを実行する
        # FFI 宣言のコンパイル確認を兼ねて Windows でも実行する。
        run: crystal spec

      - name: リソースをコンパイルする
        run: rc.exe /nologo /fo res\kxnotifyutils.res res\kxnotifyutils.rc

      - name: 本体をビルドする
        # --no-debug を外すと uing が libui-ng の debug 版を選ぶ。
        # uing はデバッグ情報の有無で release と debug を選び分けており、
        # Crystal はデバッグ情報を既定で出すため、--release だけでは debug 版が使われる。
        #
        # 行継続のバッククォートは使わず、リンク引数を変数に組み立ててから 1 行で渡す。
        # また終了コードを自分で確かめる。
        # 失敗したときに何も出力が残らないと原因を追えないためである。
        run: |
          $linkFlags = "/LIBPATH:$env:GITHUB_WORKSPACE\shim\build\Release $env:GITHUB_WORKSPACE\res\kxnotifyutils.res"
          Write-Host "link flags: $linkFlags"
          crystal build src/main.cr -o KxNotifyUtils.exe --release --no-debug --link-flags $linkFlags
          Write-Host "crystal build exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { throw "crystal build が終了コード $LASTEXITCODE で失敗した" }

      - name: 成果物を保存する
        uses: actions/upload-artifact@v4
        with:
          name: KxNotifyUtils
          path: KxNotifyUtils.exe
