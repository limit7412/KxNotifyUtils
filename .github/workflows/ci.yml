name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # 型検査と単体テストを先に回して、Windows ランナーを待たずに壊れているとわかるようにする。
  check:
    name: 型検査と単体テスト (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.14.0

      - name: 依存 shard を取得する
        # uing の postinstall は libui-ng の静的ライブラリを GitHub から取得する。
        # この取得は落ちることがあり、shards は理由を出さずに終わる。
        # 取り直せば通るため、lib を消してから間隔を空けて試し直す。
        run: |
          for attempt in 1 2 3; do
            rm -rf lib
            if shards install; then exit 0; fi
            echo "shards install に失敗した (${attempt} 回目)"
            sleep $((attempt * 10))
          done
          echo "shards install が 3 回とも失敗した" >&2
          exit 1

      - name: 書式を確かめる
        run: crystal tool format --check src spec

      - name: 単体テストを実行する
        run: crystal spec

      # 実際に配布するのは Windows 版であり、
      # Windows 向けのコード（FFI 宣言、トレイ、設定ウィンドウ）はここでしか型検査されない。
      - name: Windows 向けの型検査を行う
        run: crystal build --cross-compile --target x86_64-pc-windows-msvc src/main.cr -o kx

  build:
    name: ビルド (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # ビルドの手順はリリースとプレリリースでも使うため複合アクションに置いてある。
      # CI とリリースで違う手順を踏むと、CI が通ったのにリリースで落ちる状態が起きる。
      # バージョンは渡さない。配布物ではないため、ソースの既定値のままでよい。
      - uses: ./.github/actions/build-windows

      - name: シムのテストハーネスを動かす
        # 通知アクセスが無い環境ではハーネスが自分で「確認を飛ばす」と判断して 0 を返す。
        # それ以外の異常終了（初期化の失敗、ABI の食い違い、クラッシュ）はこのジョブを落とす。
        # 見逃すと、ビルドは通るのに動かない変更が素通りする。
        run: ./shim/build/Release/shim_harness.exe

      - name: 単体テストを実行する
        # FFI 宣言のコンパイル確認を兼ねて Windows でも実行する。
        run: crystal spec

      - name: 成果物を保存する
        uses: actions/upload-artifact@v4
        with:
          name: KxNotifyUtils
          path: KxNotifyUtils.exe
