name: KxNotifyUtils をビルドする
description: >
  シムと本体をビルドし、作業ディレクトリへ KxNotifyUtils.exe を作る。
  CI とリリースとプレリリースで同じ手順を使うため、複合アクションに切り出してある。

inputs:
  version:
    description: >
      実行ファイルへ埋めるバージョン。
      空にすると src/main.cr と res/kxnotifyutils.rc の既定値のままビルドする。
    required: false
    default: ""
  crystal:
    description: 使う Crystal のバージョン。
    required: false
    default: "1.14.0"

# ビルドの手順そのものは scripts/build.ps1 が持つ（issue #20）。
# ここが持つのは、MSVC と Crystal を用意すること、それを呼ぶこと、
# 出来た exe を検査することだけである。
# 手順を 2 か所に書くと、片方だけ直したときに配布物と手元ビルドが食い違い、
# しかも手元では再現しないため気付けない。
runs:
  using: composite
  steps:
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ inputs.crystal }}

    - name: シムと本体をビルドする
      # 終了コードは build.ps1 が自分で確かめて throw する。
      shell: pwsh
      run: ./scripts/build.ps1 -Version '${{ inputs.version }}'

    - name: exe が単体で動くことを確かめる
      # 配布物は exe 1 ファイルであり、同梱する DLL は無い（仕様書 1 章、8.2 節）。
      # リンクの仕方を間違えると Crystal が同梱する DLL を要求する exe ができ、
      # ビルドは通るのに配布先で「zlib1.dll が見つからない」と言われて起動しない。
      # ここで実際の依存を見て、残っていれば落とす。
      shell: pwsh
      run: |
        $dependents = dumpbin /nologo /dependents KxNotifyUtils.exe
        if ($LASTEXITCODE -ne 0) { throw "dumpbin が終了コード $LASTEXITCODE で失敗した" }

        # 依存を 1 つも読み取れていないなら、確認そのものが成り立っていない。
        # 何も出ていないのを「依存が無い」と読むと、この確認は素通りするだけになる。
        $imports = $dependents |
          Select-String -Pattern '^\s{4}(\S+\.dll)$' |
          ForEach-Object { $_.Matches[0].Groups[1].Value }
        if (-not $imports) {
          $dependents | Write-Host
          throw "dumpbin の出力から依存 DLL を読み取れなかった"
        }

        # 実行時に LoadLibrary で解決する openvr_api.dll はインポートに出ないため、
        # ここに並ぶのは Windows が最初から持っている DLL だけになるはずである。
        Write-Host "インポートしている DLL:"
        $imports | Sort-Object | ForEach-Object { Write-Host "  $_" }

        # Crystal の Windows 配布物が同梱する DLL。
        $bundled = @(
          "gc.dll", "pcre.dll", "pcre2-8.dll", "zlib1.dll", "iconv-2.dll",
          "libssl-3-x64.dll", "libcrypto-3-x64.dll",
          "libxml2.dll", "yaml.dll", "mpir.dll", "libffi.dll"
        )
        $found = $imports | Where-Object { $bundled -contains $_.ToLowerInvariant() }
        if ($found) {
          throw "exe が同梱前提の DLL に依存している: $($found -join ', ')"
        }

        # 実行ページから見えるようにジョブの要約へも残す。
        $summary = @("### exe がインポートしている DLL", "") +
          ($imports | Sort-Object | ForEach-Object { "- ``$_``" })
        $summary -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

        Write-Host "同梱前提の DLL への依存は無い"

    - name: コンソールの exe になっていないことを確かめる
      # /SUBSYSTEM:WINDOWS が落ちるとコンソールの exe になり、起動のたびに
      # コンソールウィンドウが残る（issue #19）。
      # リンク引数の指定ミスは、上の DLL 依存と同じくビルドが通ってしまう類であり、
      # 手元で気付けるとは限らないためここで見る。
      shell: pwsh
      run: |
        $headers = dumpbin /nologo /headers KxNotifyUtils.exe
        if ($LASTEXITCODE -ne 0) { throw "dumpbin が終了コード $LASTEXITCODE で失敗した" }

        $subsystem = $headers | Select-String -Pattern '^\s+\d+ subsystem \((.+)\)\s*$'
        if (-not $subsystem) {
          throw "dumpbin の出力からサブシステムを読み取れなかった"
        }

        $name = $subsystem[0].Matches[0].Groups[1].Value
        Write-Host "サブシステム: $name"
        if ($name -ne "Windows GUI") {
          throw "コンソールの exe になっている（サブシステムが $name）"
        }
