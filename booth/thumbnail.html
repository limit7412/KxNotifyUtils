<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>KxNotifyUtils BOOTH トップ画像候補</title>
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-jp/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-jp/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-jp/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/800.css">
<style>
  /* 配色は参考写真から拾った。銀白と青、黒に青の差し色、宇宙の紺、夕暮れの桃と橙、カフェの琥珀。
     アバターや衣装、ワールドは描かない。 */
  :root {
    --silver: #E9EDF2;
    --silver-dim: #B9C3CF;
    --ink: #141A24;
    --eye: #3D8BFF;
    --eye-deep: #1B4FD8;
    --space: #070B16;
    --amber: #FFB25A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #555;
    font-family: "Noto Sans JP", sans-serif;
    display: flex; flex-wrap: wrap; gap: 24px; padding: 24px;
  }
  .cand { width: 800px; height: 800px; position: relative; overflow: hidden; color: var(--silver); }
  .latin { font-family: "Inter", "Noto Sans JP", sans-serif; }

  /* 見出し。一行の説明と商品名だけ */
  .head { position: absolute; left: 0; right: 0; text-align: center; }
  .head .lead { font-size: 28px; font-weight: 500; letter-spacing: 0.12em; }
  .head .name { font-size: 92px; font-weight: 800; letter-spacing: -0.015em; line-height: 1.1; margin-top: 8px; }

  /* XSOverlay の通知ポップアップを模したカード。
     左上に丸いアイコン、中央寄せのタイトル、区切り線、本文の順に並ぶ。 */
  .toast {
    position: absolute; left: 190px; right: 190px;
    background: rgba(56, 62, 70, 0.94);
    border-radius: 12px; padding: 0 28px 18px;
    text-align: center; color: #fff;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
  }
  .toast .ic {
    position: absolute; left: -16px; top: -16px;
    width: 52px; height: 52px; border-radius: 50%;
    border: 3px solid #2A2F36;
    display: grid; place-items: center;
    font-weight: 900; font-size: 22px; color: #fff;
    background: linear-gradient(135deg, #5AA0FF, var(--eye-deep));
  }
  .toast .t {
    font-size: 19px; font-weight: 500; line-height: 1.3;
    margin: 0 8px 0 24px; padding: 14px 0 10px;
    border-bottom: 2px solid rgba(255, 255, 255, 0.2);
  }
  .toast .b { font-size: 19px; line-height: 1.45; padding-top: 12px; color: #E6EAEF; }

  /* JustNotification（星空と山の影、中央に一行と商品名、その下に通知）と構成が重ならないよう、
     星空と地平の影は使わず、文字も中央に積まない。 */

  /* ---------- A: 軌道上 ---------- */
  /* 地球を左下に大きく置き、文字は右上に寄せる */
  #a { background: linear-gradient(200deg, #0B1226 0%, var(--space) 60%); }
  #a .earth {
    position: absolute; left: -1000px; top: 200px; width: 1600px; height: 1600px; border-radius: 50%;
    background: radial-gradient(circle at 70% 30%, #4C8DF0 0%, #1E4FB4 18%, #0E2A6E 38%, #050B1C 60%);
    box-shadow: 0 0 50px 14px rgba(90, 160, 255, 0.5), 0 0 140px 50px rgba(61, 139, 255, 0.22);
  }
  #a .cloud {
    position: absolute; left: -1000px; top: 200px; width: 1600px; height: 1600px; border-radius: 50%;
    background:
      radial-gradient(ellipse 90px 22px at 82% 24%, rgba(255,255,255,0.45), transparent 70%),
      radial-gradient(ellipse 140px 26px at 88% 36%, rgba(255,255,255,0.35), transparent 70%),
      radial-gradient(ellipse 110px 20px at 78% 46%, rgba(255,255,255,0.4), transparent 70%);
  }
  #a .head { left: auto; right: 56px; top: 96px; text-align: right; }
  #a .head .lead { color: var(--silver-dim); }
  #a .head .name { color: var(--silver); font-size: 80px; text-shadow: 0 0 40px rgba(61, 139, 255, 0.5); }
  #a .toast { left: auto; right: 56px; width: 430px; top: 330px; }

  /* ---------- B: 黒と青 ---------- */
  /* 黒い服に青い差し色。斜めの青い帯に商品名を乗せる */
  #b { background: linear-gradient(160deg, #1A1F28 0%, #0F131A 100%); }
  #b .band {
    position: absolute; left: -200px; right: -200px; top: 270px; height: 200px;
    background: linear-gradient(90deg, #2A62E8, #3D8BFF);
    transform: rotate(-8deg);
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
  }
  #b .band::before {
    content: ""; position: absolute; inset: 14px 0;
    border-top: 2px solid rgba(255, 255, 255, 0.35); border-bottom: 2px solid rgba(255, 255, 255, 0.35);
  }
  #b .head { left: 56px; right: auto; top: 90px; text-align: left; }
  #b .head .lead { color: var(--silver-dim); }
  #b .head .name { color: #fff; font-size: 84px; margin-top: 190px; transform: rotate(-8deg); transform-origin: left center; }
  #b .toast { left: 300px; right: 56px; top: 560px; }

  /* ---------- C: カフェの夜 ---------- */
  /* 文字を左に寄せ、通知を右下に置く */
  #c { background: linear-gradient(180deg, #1B1C1F 0%, #26272B 55%, #141517 100%); }
  #c .lights {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle 110px at 62% 18%, rgba(255, 178, 90, 0.5), transparent 70%),
      radial-gradient(circle 140px at 88% 30%, rgba(255, 178, 90, 0.5), transparent 70%),
      radial-gradient(circle 70px at 76% 44%, rgba(255, 178, 90, 0.35), transparent 70%);
    filter: blur(8px);
  }
  #c .cords { position: absolute; inset: 0; }
  #c .cords i { position: absolute; top: 0; width: 2px; background: rgba(255, 255, 255, 0.18); }
  #c .cords i::after {
    content: ""; position: absolute; left: -8px; bottom: -18px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--amber); box-shadow: 0 0 24px 8px rgba(255, 178, 90, 0.55);
  }
  #c .counter {
    position: absolute; left: 0; right: 0; bottom: 0; height: 110px;
    background: linear-gradient(180deg, #7A5A3E 0 14px, #5B4330 14px 100%);
    box-shadow: 0 -20px 40px rgba(0, 0, 0, 0.45);
  }
  #c .tiles {
    position: absolute; left: 0; right: 0; bottom: 110px; height: 90px;
    background-image: linear-gradient(rgba(255,255,255,0.06) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,0.06) 2px, transparent 2px);
    background-size: 60px 45px;
  }
  #c .head { left: 56px; right: auto; top: 250px; text-align: left; }
  #c .head .lead { color: #D9CBB8; }
  #c .head .name { color: #F2EBE0; font-size: 84px; }
  #c .head .name b { color: var(--eye); font-weight: inherit; }
  #c .toast { left: 320px; right: 56px; top: 500px; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 178, 90, 0.18); }

  /* ---------- D: 銀白 ---------- */
  /* 白地。通知を上に置き、商品名を下に置く */
  #d { background: linear-gradient(160deg, #FFFFFF 0%, #EEF2F7 60%, #DCE4EE 100%); color: var(--ink); }
  #d .strands {
    position: absolute; inset: -200px;
    background: repeating-linear-gradient(115deg, rgba(185, 195, 207, 0.0) 0 22px, rgba(185, 195, 207, 0.35) 22px 24px, rgba(255,255,255,0) 24px 60px);
    mask-image: radial-gradient(ellipse 60% 70% at 70% 30%, #000, transparent 75%);
  }
  #d .glow {
    position: absolute; left: 50%; top: 180px; width: 560px; height: 240px; margin-left: -280px;
    background: radial-gradient(ellipse at 50% 50%, rgba(61, 139, 255, 0.5), rgba(61, 139, 255, 0) 70%);
    filter: blur(6px);
  }
  #d .toast { top: 210px; box-shadow: 0 24px 48px rgba(20, 26, 36, 0.28); }
  #d .head { top: 430px; }
  #d .head .lead { color: #5C6B7D; }
  #d .head .name { color: var(--ink); }
  #d .head .name b { color: var(--eye); font-weight: inherit; }
</style>
</head>
<body>

<!-- A: 軌道上。地球を左下に大きく置き、文字は右上 -->
<section class="cand" id="a">
  <div class="earth"></div>
  <div class="cloud"></div>
  <div class="head">
    <div class="lead">Windows の通知を VR で受け取る</div>
    <div class="name latin">KxNotifyUtils</div>
  </div>
  <div class="toast"><div class="ic">#</div><div class="t">チャット</div><div class="b">そろそろワールド移動しよう</div></div>
</section>

<!-- B: 黒と青。斜めの青い帯に商品名 -->
<section class="cand" id="b">
  <div class="band"></div>
  <div class="head">
    <div class="lead">HMD を外さずに通知を確認</div>
    <div class="name latin">KxNotifyUtils</div>
  </div>
  <div class="toast"><div class="ic">#</div><div class="t">チャット</div><div class="b">そろそろワールド移動しよう</div></div>
</section>

<!-- C: カフェの夜。文字は左、通知は右下 -->
<section class="cand" id="c">
  <div class="lights"></div>
  <div class="cords">
    <i style="left:496px;height:130px"></i>
    <i style="left:700px;height:210px"></i>
  </div>
  <div class="tiles"></div>
  <div class="counter"></div>
  <div class="head">
    <div class="lead">Windows の通知を VR で受け取る</div>
    <div class="name latin">Kx<b>Notify</b>Utils</div>
  </div>
  <div class="toast"><div class="ic">#</div><div class="t">チャット</div><div class="b">そろそろワールド移動しよう</div></div>
</section>

<!-- D: 銀白。通知が上、商品名が下 -->
<section class="cand" id="d">
  <div class="strands"></div>
  <div class="glow"></div>
  <div class="toast"><div class="ic">#</div><div class="t">チャット</div><div class="b">そろそろワールド移動しよう</div></div>
  <div class="head">
    <div class="lead">Windows の通知を VR で受け取る</div>
    <div class="name latin">Kx<b>Notify</b>Utils</div>
  </div>
</section>


</body>
</html>
