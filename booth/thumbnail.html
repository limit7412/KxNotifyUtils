<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>KxNotifyUtils BOOTH トップ画像候補</title>
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-jp/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-jp/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-jp/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/800.css">
<style>
  /* 配色は参考写真から拾った。銀白と青、黒に青の差し色、宇宙の紺、夕暮れの桃と橙、カフェの琥珀。
     アバターや衣装、ワールドは描かない。 */
  :root {
    --silver: #E9EDF2;
    --silver-dim: #B9C3CF;
    --ink: #141A24;
    --eye: #3D8BFF;
    --eye-deep: #1B4FD8;
    --space: #070B16;
    --amber: #FFB25A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #555;
    font-family: "Noto Sans JP", sans-serif;
    display: flex; flex-wrap: wrap; gap: 24px; padding: 24px;
  }
  .cand { width: 800px; height: 800px; position: relative; overflow: hidden; color: var(--silver); }
  .latin { font-family: "Inter", "Noto Sans JP", sans-serif; }

  /* 見出し。一行の説明と商品名だけ */
  .head { position: absolute; left: 0; right: 0; text-align: center; }
  .head .lead { font-size: 28px; font-weight: 500; letter-spacing: 0.12em; }
  .head .name { font-size: 92px; font-weight: 800; letter-spacing: -0.015em; line-height: 1.1; margin-top: 8px; }

  /* XSOverlay の通知ポップアップを模したカード。
     左上に丸いアイコン、中央寄せのタイトル、区切り線、本文の順に並ぶ。 */
  .toast {
    position: absolute; left: 190px; right: 190px;
    background: rgba(56, 62, 70, 0.94);
    border-radius: 12px; padding: 0 28px 18px;
    text-align: center; color: #fff;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
  }
  .toast .ic {
    position: absolute; left: -16px; top: -16px;
    width: 52px; height: 52px; border-radius: 50%;
    border: 3px solid #2A2F36;
    display: grid; place-items: center;
    font-weight: 900; font-size: 22px; color: #fff;
    background: linear-gradient(135deg, #5AA0FF, var(--eye-deep));
  }
  .toast .t {
    font-size: 19px; font-weight: 500; line-height: 1.3;
    margin: 0 8px 0 24px; padding: 14px 0 10px;
    border-bottom: 2px solid rgba(255, 255, 255, 0.2);
  }
  .toast .b { font-size: 19px; line-height: 1.45; padding-top: 12px; color: #E6EAEF; }

  .stars { position: absolute; inset: 0; pointer-events: none; }
  .stars i { position: absolute; border-radius: 50%; background: #fff; }

  /* ---------- A: 宇宙 ---------- */
  #a { background: var(--space); }
  #a .nebula {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 30% 25%, rgba(61, 139, 255, 0.28), transparent 70%),
      radial-gradient(ellipse 50% 40% at 80% 60%, rgba(27, 79, 216, 0.22), transparent 70%);
  }
  /* 地球の縁。画面下に大きな円を置き、大気の青い光を縁に乗せる */
  #a .earth {
    position: absolute; left: 50%; top: 640px; width: 2200px; height: 2200px; margin-left: -1100px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 8%, #2C64C8 0%, #143A86 12%, #0B1F4E 26%, #050B1C 45%);
    box-shadow: 0 0 60px 20px rgba(80, 150, 255, 0.45), 0 0 160px 60px rgba(61, 139, 255, 0.25);
  }
  #a .cloud {
    position: absolute; left: 0; right: 0; top: 640px; height: 160px;
    background:
      radial-gradient(ellipse 120px 26px at 18% 40%, rgba(255,255,255,0.35), transparent 70%),
      radial-gradient(ellipse 200px 30px at 55% 55%, rgba(255,255,255,0.3), transparent 70%),
      radial-gradient(ellipse 140px 24px at 85% 35%, rgba(255,255,255,0.32), transparent 70%);
  }
  /* 右手の白いリング光 */
  #a .ring {
    position: absolute; right: -950px; top: -850px; width: 1200px; height: 1200px; border-radius: 50%;
    border: 6px solid rgba(255, 255, 255, 0.85);
    box-shadow: 0 0 40px rgba(255, 255, 255, 0.6), inset 0 0 40px rgba(255, 255, 255, 0.4);
  }
  #a .head { top: 190px; }
  #a .head .lead { color: var(--silver-dim); }
  #a .head .name { color: var(--silver); text-shadow: 0 0 40px rgba(61, 139, 255, 0.55); }
  #a .toast { top: 440px; }

  /* ---------- B: 夕暮れの星空 ---------- */
  #b {
    background:
      radial-gradient(ellipse 50% 45% at 20% 85%, #FF9C7A 0%, rgba(255, 156, 122, 0) 70%),
      radial-gradient(ellipse 45% 40% at 70% 20%, #FFB98A 0%, rgba(255, 185, 138, 0) 70%),
      radial-gradient(ellipse 60% 50% at 85% 70%, #7A5BD8 0%, rgba(122, 91, 216, 0) 70%),
      linear-gradient(200deg, #2C4FB8 0%, #4E63C9 35%, #B872B9 70%, #FFA07E 100%);
  }
  #b .haze {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 30% 20% at 40% 40%, rgba(255,255,255,0.25), transparent 70%),
      radial-gradient(ellipse 35% 18% at 65% 62%, rgba(120, 200, 255, 0.25), transparent 70%);
  }
  /* 針葉樹の影。三角を重ねただけの形 */
  #b .trees { position: absolute; left: 0; right: 0; bottom: 0; height: 200px; }
  #b .trees svg { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; }
  #b .head { top: 150px; }
  #b .head .lead { color: #fff; text-shadow: 0 2px 12px rgba(40, 30, 80, 0.5); }
  #b .head .name { color: #fff; text-shadow: 0 4px 24px rgba(40, 30, 80, 0.55); }
  #b .toast { top: 400px; }

  /* ---------- C: カフェの夜 ---------- */
  #c { background: linear-gradient(180deg, #1B1C1F 0%, #26272B 55%, #141517 100%); }
  #c .lights {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle 120px at 15% 22%, rgba(255, 178, 90, 0.55), transparent 70%),
      radial-gradient(circle 90px at 50% 12%, rgba(255, 178, 90, 0.45), transparent 70%),
      radial-gradient(circle 140px at 86% 26%, rgba(255, 178, 90, 0.5), transparent 70%),
      radial-gradient(circle 70px at 70% 40%, rgba(255, 178, 90, 0.35), transparent 70%);
    filter: blur(8px);
  }
  /* 吊り下げ照明の線と、カウンターの板 */
  #c .cords { position: absolute; inset: 0; }
  #c .cords i { position: absolute; top: 0; width: 2px; background: rgba(255, 255, 255, 0.18); }
  #c .cords i::after {
    content: ""; position: absolute; left: -8px; bottom: -18px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--amber); box-shadow: 0 0 24px 8px rgba(255, 178, 90, 0.55);
  }
  #c .counter {
    position: absolute; left: 0; right: 0; bottom: 0; height: 110px;
    background: linear-gradient(180deg, #7A5A3E 0 14px, #5B4330 14px 100%);
    box-shadow: 0 -20px 40px rgba(0, 0, 0, 0.45);
  }
  #c .tiles {
    position: absolute; left: 0; right: 0; bottom: 110px; height: 90px;
    background-image: linear-gradient(rgba(255,255,255,0.06) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,0.06) 2px, transparent 2px);
    background-size: 60px 45px;
    opacity: 0.9;
  }
  #c .head { top: 210px; }
  #c .head .lead { color: #D9CBB8; }
  #c .head .name { color: #F2EBE0; }
  #c .head .name b { color: var(--eye); font-weight: inherit; }
  #c .toast { top: 460px; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 178, 90, 0.18); }

  /* ---------- D: 銀白 ---------- */
  #d { background: linear-gradient(160deg, #FFFFFF 0%, #EEF2F7 60%, #DCE4EE 100%); color: var(--ink); }
  /* 髪の流れを思わせる、斜めの細い筋 */
  #d .strands {
    position: absolute; inset: -200px;
    background: repeating-linear-gradient(115deg, rgba(185, 195, 207, 0.0) 0 22px, rgba(185, 195, 207, 0.35) 22px 24px, rgba(255,255,255,0) 24px 60px);
    mask-image: radial-gradient(ellipse 60% 70% at 70% 30%, #000, transparent 75%);
  }
  /* 瞳の青い光 */
  #d .glow {
    position: absolute; left: 50%; top: 470px; width: 520px; height: 220px; margin-left: -260px;
    background: radial-gradient(ellipse at 50% 50%, rgba(61, 139, 255, 0.55), rgba(61, 139, 255, 0) 70%);
    filter: blur(6px);
  }
  #d .head { top: 200px; }
  #d .head .lead { color: #5C6B7D; }
  #d .head .name { color: var(--ink); }
  #d .head .name b { color: var(--eye); font-weight: inherit; }
  #d .toast { top: 450px; box-shadow: 0 24px 48px rgba(20, 26, 36, 0.28); }
</style>
</head>
<body>

<!-- A: 宇宙。地球の縁と白いリング光。銀白の文字に青い光 -->
<section class="cand" id="a">
  <div class="nebula"></div>
  <div class="stars" data-stars="140"></div>
  <div class="ring"></div>
  <div class="earth"></div>
  <div class="cloud"></div>
  <div class="head">
    <div class="lead">Windows の通知を VR で受け取る</div>
    <div class="name latin">KxNotifyUtils</div>
  </div>
  <div class="toast"><div class="ic">#</div><div class="t">チャット</div><div class="b">そろそろワールド移動しよう</div></div>
</section>

<!-- B: 夕暮れの星空。桃と橙と青の空に、針葉樹の影 -->
<section class="cand" id="b">
  <div class="haze"></div>
  <div class="stars" data-stars="90" data-max="500"></div>
  <div class="head">
    <div class="lead">HMD を外さずに通知を確認</div>
    <div class="name latin">KxNotifyUtils</div>
  </div>
  <div class="toast"><div class="ic">#</div><div class="t">チャット</div><div class="b">そろそろワールド移動しよう</div></div>
  <div class="trees"><svg viewBox="0 0 800 260" preserveAspectRatio="none" data-trees></svg></div>
</section>

<!-- C: カフェの夜。琥珀の照明とカウンター。青の差し色 -->
<section class="cand" id="c">
  <div class="lights"></div>
  <div class="cords">
    <i style="left:120px;height:150px"></i>
    <i style="left:400px;height:90px"></i>
    <i style="left:690px;height:180px"></i>
  </div>
  <div class="tiles"></div>
  <div class="counter"></div>
  <div class="head">
    <div class="lead">Windows の通知を VR で受け取る</div>
    <div class="name latin">Kx<b>Notify</b>Utils</div>
  </div>
  <div class="toast"><div class="ic">#</div><div class="t">チャット</div><div class="b">そろそろワールド移動しよう</div></div>
</section>

<!-- D: 銀白。白地に髪の筋と、瞳の青い光 -->
<section class="cand" id="d">
  <div class="strands"></div>
  <div class="glow"></div>
  <div class="head">
    <div class="lead">Windows の通知を VR で受け取る</div>
    <div class="name latin">Kx<b>Notify</b>Utils</div>
  </div>
  <div class="toast"><div class="ic">#</div><div class="t">チャット</div><div class="b">そろそろワールド移動しよう</div></div>
</section>

<script>
  // 星。位置と大きさは固定の擬似乱数で決め、書き出すたびに変わらないようにする
  function rng(seed) { return () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296; }
  document.querySelectorAll(".stars").forEach((el, k) => {
    const r = rng(7 + k), n = +el.dataset.stars, maxY = +(el.dataset.max || 800);
    for (let i = 0; i < n; i++) {
      const s = document.createElement("i"), size = 1 + r() * 2.4;
      s.style.cssText = `left:${r() * 800}px;top:${r() * maxY}px;width:${size}px;height:${size}px;opacity:${0.35 + r() * 0.65}`;
      el.appendChild(s);
    }
  });

  // 針葉樹の影。三角を三段重ねた形を並べる
  const trees = document.querySelector("[data-trees]");
  if (trees) {
    const r = rng(3); let d = "";
    for (let x = -20; x < 830; x += 26 + r() * 22) {
      const h = 70 + r() * 90, w = 16 + r() * 12, base = 260;
      for (let t = 0; t < 3; t++) {
        const y = base - h * (0.35 + t * 0.32), ww = w * (1 - t * 0.22), top = y - h * 0.42;
        d += `M${x - ww},${y} L${x},${top} L${x + ww},${y} Z `;
      }
      d += `M${x - 2},${base} L${x - 2},${base - h * 0.3} L${x + 2},${base - h * 0.3} L${x + 2},${base} Z `;
    }
    trees.innerHTML = `<path d="${d}" fill="#1C1A3A" opacity="0.92"/>`;
  }
</script>
</body>
</html>
